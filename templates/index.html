<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Location Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: #f0f0f0;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
        }
        h1 { color: #333; }
        .status {
            padding: 15px;
            margin: 15px 0;
            border-radius: 8px;
            font-weight: bold;
        }
        .status.waiting { background: #fff3cd; color: #856404; }
        .status.success { background: #d4edda; color: #155724; }
        .status.error { background: #f8d7da; color: #721c24; }
        .coords {
            font-size: 18px;
            font-weight: bold;
            color: #007bff;
            margin: 10px 0;
        }
        .btn {
            background: #007bff;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }
        .btn:hover { background: #0056b3; }
        .debug {
            margin-top: 15px;
            padding: 10px;
            background: #1a1a2e;
            color: #00ff41;
            font-family: monospace;
            font-size: 11px;
            border-radius: 4px;
            text-align: left;
            max-height: 150px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📍 Location Test</h1>
    <div class="status waiting" id="status">⏳ Press button to get location</div>
    <div class="coords" id="coords">--</div>
    <button class="btn" id="getLocationBtn">📍 Get My Location</button>
    <div class="debug" id="debugLog">📋 Logs will appear here...</div>
</div>

<script>
    // =============================================
    // CONFIGURATION — CHANGE THIS TO YOUR RENDER URL
    // =============================================
    const RENDER_URL = 'https://location-tracker-cn7m.onrender.com';

    // =============================================
    // DOM Elements
    // =============================================
    const statusDiv = document.getElementById('status');
    const coordsDiv = document.getElementById('coords');
    const debugLog = document.getElementById('debugLog');
    const getLocationBtn = document.getElementById('getLocationBtn');

    // =============================================
    // Debug Logger
    // =============================================
    function debug(message) {
        const timestamp = new Date().toLocaleTimeString();
        const logEntry = `[${timestamp}] ${message}`;
        console.log(logEntry);
        debugLog.textContent += logEntry + '\n';
        debugLog.scrollTop = debugLog.scrollHeight;
    }

    // =============================================
    // Set Status
    // =============================================
    function setStatus(message, type = 'waiting') {
        statusDiv.textContent = message;
        statusDiv.className = 'status ' + type;
    }

    // =============================================
    // Get Device Info
    // =============================================
    function getDeviceInfo() {
        const ua = navigator.userAgent;
        let device = 'Unknown';
        if (ua.includes('iPhone')) device = 'iPhone';
        else if (ua.includes('iPad')) device = 'iPad';
        else if (ua.includes('Android')) device = 'Android';
        else if (ua.includes('Windows')) device = 'Windows PC';
        else if (ua.includes('Mac')) device = 'Mac';
        return { userAgent: ua, device_name: device };
    }

    // =============================================
    // Get Location
    // =============================================
    function getLocation() {
        debug('📍 Get Location button clicked');
        debug('📡 RENDER_URL: ' + RENDER_URL);

        if (!navigator.geolocation) {
            debug('❌ Geolocation not supported');
            setStatus('❌ Geolocation not supported', 'error');
            return;
        }

        setStatus('⏳ Requesting location...', 'waiting');
        debug('📡 Calling navigator.geolocation.getCurrentPosition...');

        navigator.geolocation.getCurrentPosition(
            // --- SUCCESS ---
            function(position) {
                const lat = position.coords.latitude;
                const lng = position.coords.longitude;
                const accuracy = position.coords.accuracy;

                debug('✅ Location captured!');
                debug('📍 Lat: ' + lat + ', Lng: ' + lng);
                debug('📍 Accuracy: ' + accuracy + 'm');

                coordsDiv.textContent = `📍 ${lat.toFixed(6)}, ${lng.toFixed(6)}`;
                setStatus('✅ Location captured! Sending...', 'success');

                const payload = {
                    lat: lat,
                    lng: lng,
                    accuracy: accuracy,
                    device_info: getDeviceInfo()
                };

                debug('📤 Sending to: ' + RENDER_URL + '/send-location');

                fetch(RENDER_URL + '/send-location', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                })
                .then(response => {
                    debug('📥 Response status: ' + response.status);
                    if (!response.ok) throw new Error('Server error: ' + response.status);
                    return response.json();
                })
                .then(data => {
                    debug('✅ Data sent successfully!');
                    debug('📥 Response: ' + JSON.stringify(data));
                    setStatus('✅ Location sent to server! Check your dashboard.', 'success');
                })
                .catch(err => {
                    debug('❌ Fetch failed: ' + err.message);
                    setStatus('⚠️ Server error, but location captured', 'error');
                });
            },
            // --- ERROR ---
            function(error) {
                debug('❌ Geolocation error: ' + error.message);
                debug('❌ Error code: ' + error.code);
                setStatus('❌ ' + error.message, 'error');
            },
            {
                enableHighAccuracy: true,
                timeout: 15000,
                maximumAge: 0
            }
        );
    }

    // =============================================
    // Event Listeners
    // =============================================
    getLocationBtn.addEventListener('click', getLocation);

    // =============================================
    // INIT
    // =============================================
    debug('🚀 Page loaded');
    debug('📍 RENDER_URL: ' + RENDER_URL);
    debug('📱 User Agent: ' + navigator.userAgent);
</script>
</body>
</html>
